name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n install.sh uninstall.sh doctor.sh
      - run: node --check src/server.js
      - run: node --check src/spiceflow.js
      - run: node test/server.test.js
      - run: node test/pywal.test.js
